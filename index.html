<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box}

.admin{border:1px solid #e1e6f1}.admin h2{font-size:17px;letter-spacing:-.2px;margin:0 0 12px}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.admin-list{max-height:320px;overflow:auto;display:flex;flex-direction:column;gap:7px;margin-top:9px}.admin-item{background:var(--soft);border:1px solid #e9edf5;border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px}.admin-item button{padding:8px 10px;font-size:12px}.admin-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.admin-tools input{flex:1 1 150px}.small{font-size:12px;color:var(--muted)}
.preview{display:block;max-width:100%;max-height:380px;border-radius:12px;margin-top:10px;background:#e9edf5}.download{display:inline-flex;align-items:center;background:#5268e8;color:white;border-radius:10px;padding:9px 12px;text-decoration:none;margin-top:9px;font-size:13px;font-weight:700}.hidden{display:none!important}
@media(max-width:600px){.wrap{padding:10px;gap:10px}.panel{padding:14px;border-radius:16px}header.panel{padding:17px}.brandname{font-size:23px}.logo-mark{width:38px;height:38px;flex-basis:38px;border-radius:13px}h1{font-size:22px}.row>*{flex:1 1 100%}.send button{flex:0 0 auto}.admin-grid{grid-template-columns:1fr}#chat{min-height:260px;padding:12px}}
</style></head><body>
<div class="wrap">
<header class="panel"><div class="brandline"><div class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M8.8 14.8 7.1 16.5a3.2 3.2 0 0 1-4.5-4.5l4-4a3.2 3.2 0 0 1 4.5 0" stroke="white" stroke-width="2.1" stroke-linecap="round"/><path d="m15.2 9.2 1.7-1.7a3.2 3.2 0 0 1 4.5 4.5l-4 4a3.2 3.2 0 0 1-4.5 0" stroke="white" stroke-width="2.1" stroke-linecap="round"/><path d="m8.8 15.2 6.4-6.4" stroke="white" stroke-width="2.1" stroke-linecap="round"/></svg></div><div><div class="brandname">LINK</div><div class="brandtag">실시간으로 이어지는 대화</div></div></div>

</header>

<div class="admin-tools"><button id="renameAdminRoom" class="secondary">방 이름 변경</button><input id="adminResetRoomPassword" type="password" placeholder="새 방 비밀번호"><button id="resetAdminRoomPassword" class="secondary">방 비밀번호 재설정</button><button id="deleteAdminRoom">방 삭제</button></div>
<div class="admin-tools"><button id="loadAdminMessages" class="secondary">메시지 100개 불러오기</button><button id="olderAdminMessages" class="secondary" disabled>이전 100개</button><button id="loadAdminUsers" class="secondary">참여자 UID 조회</button></div>
<div class="admin-list" id="adminMessages"></div><div class="admin-list" id="adminUsers"></div>
</section>
<div class="panel"><div class="room-label" id="currentRoom">입장한 방 없음</div></div>
<main id="chat" class="panel" aria-live="polite"></main>
<form class="panel send" id="form"><div style="width:100%" class="attachbar"><input id="fileInput" type="file" disabled><span class="small" id="fileInfo">파일 최대 7MB</span><button type="button" id="clearFile" class="filebtn" disabled>첨부 취소</button></div><textarea id="message" maxlength="1000" rows="2" placeholder="메시지 입력…" disabled></textarea><button id="send" disabled>전송</button></form>
</div>
<script>
window.linkFirebaseWatchdog=setTimeout(()=>{const s=document.getElementById("status");if(s&&s.textContent.includes("Firebase 연결 중")){s.textContent="Firebase SDK가 시작되지 않았어요. 인터넷 연결과 HTML 파일을 Safari/Chrome에서 직접 열었는지 확인해 주세요. 파일 미리보기에서는 모듈이 차단될 수 있습니다."}},12000);
window.addEventListener("error",e=>{const s=document.getElementById("status");if(s&&s.textContent.includes("Firebase 연결 중"))s.textContent="Firebase 스크립트 오류: "+(e.message||"SDK 파일을 불러오지 못했습니다.")});
window.addEventListener("unhandledrejection",e=>{const s=document.getElementById("status");if(s&&s.textContent.includes("Firebase 연결 중"))s.textContent="Firebase 연결 오류: "+(e.reason?.message||String(e.reason||"알 수 없는 오류"))});
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously,signInWithEmailAndPassword,signOut,updatePassword} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getDatabase,ref,push,query,limitToLast,onChildAdded,get,runTransaction,serverTimestamp,set,update,remove,onValue,orderByKey,endAt,limitToFirst} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig={
apiKey:"AIzaSyAbcrOyj7_cZvgi2C1YAlChQ2EYMhzb7Qw",
authDomain:"link-12855.firebaseapp.com",
databaseURL:"https://link-12855-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"link-12855",
storageBucket:"link-12855.firebasestorage.app",
messagingSenderId:"160690043744",
appId:"1:160690043744:web:6ce06f7c946251b3b0fc05"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),$=id=>document.getElementById(id);
let room="",roomTitle="",stopMessages=null,stopBlocked=null,joined=false,isAdmin=false,adminRoom="",adminOldestKey=null;
const normalizeRoomName=s=>String(s||"").trim().replace(/\\s+/g," ").toLowerCase().slice(0,48);
async function roomKeyFromName(name){return "r"+(await digest(normalizeRoomName(name))).slice(0,40);}
function status(t){$("status").textContent=t}
async function authReady(){if(!auth.currentUser)await signInAnonymously(auth)}
async function digest(s){const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function render(d,key){
 if(!d||d.kind==="room-meta")return;
 const box=document.createElement("div");box.className="msg"+(d.uid&&auth.currentUser&&d.uid===auth.currentUser.uid?" mine":"");
 const meta=document.createElement("div");meta.className="meta";
 const time=d.timestamp?new Date(d.timestamp).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}):"";
 meta.textContent=String(d.nickname||"익명").slice(0,24)+(time?" · "+time:"");
 const txt=document.createElement("div");txt.className="text";txt.textContent=String(d.text||"").slice(0,1000);
 box.append(meta,txt);
 if(d.attachmentId&&d.attachmentName){
  const f=document.createElement("button");f.type="button";f.className="filebtn";f.textContent="파일: "+String(d.attachmentName).slice(0,120)+" · "+formatSize(d.attachmentSize||0);
  f.onclick=()=>openAttachment(d.attachmentId,d.attachmentName,d.attachmentType||"application/octet-stream",d.attachmentSize||0,box);
  box.append(f);
 }
 if(isAdmin&&key){const del=document.createElement("button");del.type="button";del.className="secondary";del.textContent="메시지 삭제";del.onclick=async()=>{if(confirm("이 메시지를 삭제할까요?")){try{await remove(ref(db,"rooms/"+room+"/messages/"+key));if(d.attachmentId)await remove(ref(db,"attachments/"+d.attachmentId));box.remove()}catch(e){status("삭제 실패: "+e.message)}}};box.append(del)}
 $("chat").append(box);$("chat").scrollTop=$("chat").scrollHeight;
}
function formatSize(n){return n<1024? n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(2)+" MB"}
function toBase64(buffer){let bytes=new Uint8Array(buffer),bin="",chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk)bin+=String.fromCharCode(...bytes.subarray(i,i+chunk));return btoa(bin)}
async function openAttachment(id,name,type,size,container){
 try{
  const snap=await get(ref(db,"attachments/"+id+"/data"));if(!snap.exists())throw new Error("파일 데이터가 없습니다.");
  const data=snap.val();if(typeof data!=="string")throw new Error("파일 형식이 올바르지 않습니다.");
  const raw=atob(data),arr=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
  const safeType=/^(image\/(png|jpeg|gif|webp)|video\/(mp4|webm|ogg)|application\/pdf|text\/plain)$/.test(type)?type:"application/octet-stream";
  const blob=new Blob([arr],{type:safeType}),url=URL.createObjectURL(blob);
  if(safeType.startsWith("image/")||safeType.startsWith("video/")){
   const isImage=safeType.startsWith("image/");
   let el=isImage?document.createElement("img"):document.createElement("video");
   el.className="preview";el.src=url;
   if(el.tagName==="VIDEO"){el.controls=true;el.preload="metadata"}
   el.alt=name;container.append(el);
   const a=document.createElement("a");a.className="download";a.href=url;a.download=name;
   a.textContent=isImage?"이미지 다운로드":"동영상 다운로드";a.setAttribute("aria-label",a.textContent+": "+name);container.append(a);
  }else{
   const a=document.createElement("a");a.className="download";a.href=url;a.download=name;a.textContent="파일 다운로드";container.append(a);
  }
 }catch(e){status("파일 열기 실패: "+e.message)}
}
function allowedFile(file){const ext=(file.name.split(".").pop()||"").toLowerCase();return ["png","jpg","jpeg","gif","webp","mp4","webm","ogg","pdf","txt","csv","doc","docx","xls","xlsx","ppt","pptx","zip","html"].includes(ext)&&!["exe","msi","bat","cmd","com","scr","js","mjs","jar","apk","dmg","sh","ps1"].includes(ext)}

function attachRoom(code,title){
 if(stopMessages)stopMessages();if(stopBlocked)stopBlocked();
 room=code;roomTitle=title||code;joined=true;$ ("chat").replaceChildren();
 if(auth.currentUser)set(ref(db,"rooms/"+room+"/members/"+auth.currentUser.uid),true).catch(e=>status("참여자 등록 실패: "+e.message));
 $("currentRoom").textContent=roomTitle+" · "+room;
 stopMessages=onChildAdded(query(ref(db,"rooms/"+room+"/messages"),limitToLast(1000)),s=>render(s.val(),s.key),e=>status("메시지 읽기 오류: "+e.message));
 if(auth.currentUser){stopBlocked=onValue(ref(db,"rooms/"+room+"/blocked/"+auth.currentUser.uid),s=>{if(s.val()===true){joined=false;$ ("message").disabled=true;$ ("send").disabled=true;$ ("fileInput").disabled=true;status("관리자에 의해 이 방에서 차단되었습니다.");if(stopMessages)stopMessages();}})}
 $("message").disabled=false;$ ("send").disabled=false;$ ("fileInput").disabled=false;$ ("clearFile").disabled=false;
 status("입장 완료. 파일 첨부 가능(최대 7MB).");$ ("message").focus();
}

$("createRoom").onclick=async()=>{
 const name=$("roomName").value.trim().replace(/\\s+/g," ").slice(0,48),password=$("roomPassword").value;
 if(!name){status("방 이름을 입력해 주세요.");return}
 if(!password){status("방 비밀번호를 입력해 주세요.");return}
 const btn=$("createRoom");btn.disabled=true;status("방 만드는 중…");
 try{
  await authReady();
  const blockSnap=await get(ref(db,"config/roomCreationBlocked"));if(blockSnap.val()===true&&!isAdmin)throw new Error("관리자가 방 생성을 차단했습니다.");
  const code=await roomKeyFromName(name);
  const infoRef=ref(db,"rooms/"+code+"/info");
  const info={name,passwordHash:await digest(password),createdAt:Date.now(),createdBy:auth.currentUser.uid};
  const result=await runTransaction(infoRef,current=>current===null?info:undefined);
  if(!result.committed)throw new Error("같은 이름의 방이 이미 있습니다. 방 이름으로 입장해 주세요.");
  attachRoom(code,name);status("방 생성 완료. 이제 같은 방 이름과 비밀번호로 입장할 수 있습니다.");
 }catch(e){status("방 생성 실패: "+e.message+" (DB 규칙을 확인하세요.)")}
 finally{btn.disabled=false}
};
$("joinRoom").onclick=async()=>{
 const name=$("roomName").value.trim().replace(/\\s+/g," ").slice(0,48),password=$("roomPassword").value;
 if(!name){status("방 이름을 입력해 주세요.");return}
 if(!password){status("방 비밀번호를 입력해 주세요.");return}
 const btn=$("joinRoom");btn.disabled=true;status("방 확인 중…");
 try{
  await authReady();const code=await roomKeyFromName(name);
  const snap=await get(ref(db,"rooms/"+code+"/info"));
  if(!snap.exists())throw new Error("해당 방이 없습니다. 방 이름을 확인하거나 먼저 방을 만들어 주세요.");
  const info=snap.val()||{};
  if(!info.passwordHash||await digest(password)!==info.passwordHash)throw new Error("방 이름 또는 비밀번호가 올바르지 않습니다.");
  const blocked=await get(ref(db,"rooms/"+code+"/blocked/"+auth.currentUser.uid));if(blocked.val()===true)throw new Error("이 방에서 차단되었습니다.");
  attachRoom(code,String(info.name||name).slice(0,48));
 }catch(e){status("입장 실패: "+e.message+" (Firebase DB 읽기 규칙을 확인하세요.)")}
 finally{btn.disabled=false}
};
$("form").addEventListener("submit",async e=>{
 e.preventDefault();const text=$("message").value.trim(),file=$("fileInput").files?.[0];if(!joined||(!text&&!file))return;
 if(file&&(!allowedFile(file)||file.size>7*1024*1024)){status("허용된 파일 형식이며 7MB 이하인 파일만 첨부할 수 있습니다.");return}
 $("send").disabled=true;let attachment=null;
 try{
  if(file){status("파일을 업로드하는 중…");const id=push(ref(db,"attachments")).key;const base64=toBase64(await file.arrayBuffer());
   await set(ref(db,"attachments/"+id),{data:base64,name:file.name.slice(0,180),type:file.type||"application/octet-stream",size:file.size,room,uploadedBy:auth.currentUser?.uid||"",uploadedAt:Date.now()});
   attachment={attachmentId:id,attachmentName:file.name.slice(0,180),attachmentType:file.type||"application/octet-stream",attachmentSize:file.size};
  }
  await push(ref(db,"rooms/"+room+"/messages"),{uid:auth.currentUser?.uid||"",nickname:$("nickname").value.trim().slice(0,24)||"익명",text:text.slice(0,1000),timestamp:serverTimestamp(),...(attachment||{})});
  $("message").value="";$("fileInput").value="";$("fileInfo").textContent="파일 최대 7MB";status("전송 완료.");
 }catch(err){status("전송 실패: "+err.message+" (Realtime Database 규칙·용량 제한을 확인하세요.)")}
 finally{$("send").disabled=false;$ ("message").focus()}
});
$("fileInput").addEventListener("change",()=>{const f=$("fileInput").files?.[0];$("fileInfo").textContent=f?f.name+" · "+formatSize(f.size):"파일 최대 7MB"});
$("clearFile").onclick=()=>{$("fileInput").value="";$("fileInfo").textContent="파일 최대 7MB"};

$("message").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("form").requestSubmit()}});
// 관리자 모드는 Firebase Auth 이메일/비밀번호 계정과 /admins/{uid}=true 등록을 요구합니다.
async function adminCheck(){isAdmin=false;const u=auth.currentUser;if(!u||!u.email)return false;const snap=await get(ref(db,"admins/"+u.uid));isAdmin=snap.val()===true;$("adminPanel").classList.toggle("hidden",!isAdmin);$("adminLogout").classList.toggle("hidden",!isAdmin);$("adminStatus").textContent=isAdmin?"관리자 인증 완료":"이 계정은 관리자 권한이 없습니다.";if(isAdmin)await refreshAdminRooms();return isAdmin}
$("adminLogin").onclick=async()=>{const email=$("adminEmail").value.trim(),pw=$("adminPassword").value;if(!email||!pw){$("adminStatus").textContent="이메일과 비밀번호를 입력하세요.";return}try{if(auth.currentUser?.isAnonymous)await signOut(auth);await signInWithEmailAndPassword(auth,email,pw);if(!await adminCheck()){status("관리자 UID가 /admins에 등록되어 있지 않습니다.");}else status("관리자 로그인 완료.")}catch(e){$("adminStatus").textContent="로그인 실패: "+e.message}};
$("adminLogout").onclick=async()=>{try{await signOut(auth);isAdmin=false;$("adminPanel").classList.add("hidden");$("adminLogout").classList.add("hidden");$("adminStatus").textContent="로그아웃되었습니다.";await signInAnonymously(auth)}catch(e){status("로그아웃 실패: "+e.message)}};
async function refreshAdminRooms(){if(!isAdmin)return;try{const snap=await get(ref(db,"rooms")),sel=$("adminRoomSelect");sel.replaceChildren(new Option("관리할 방 선택",""));snap.forEach(ch=>{const info=ch.child("info").val()||{};sel.add(new Option((info.name||ch.key)+" · "+ch.key,ch.key))});const b=await get(ref(db,"config/roomCreationBlocked"));$("toggleRoomBlock").textContent=b.val()===true?"방 생성 차단 해제":"방 생성 차단"}catch(e){$("adminStatus").textContent="방 목록 조회 실패: "+e.message}}
$("refreshRooms").onclick=refreshAdminRooms;
$("toggleRoomBlock").onclick=async()=>{if(!isAdmin)return;try{const r=ref(db,"config/roomCreationBlocked"),s=await get(r);await set(r,s.val()!==true);await refreshAdminRooms()}catch(e){status("설정 변경 실패: "+e.message)}};
$("renameAdminRoom").onclick=async()=>{const c=$("adminRoomSelect").value,n=$("adminNewRoomName").value.trim();if(!isAdmin||!c||!n)return;try{await update(ref(db,"rooms/"+c+"/info"),{name:n.slice(0,48)});await refreshAdminRooms();status("방 이름을 변경했습니다.")}catch(e){status("변경 실패: "+e.message)}};
$("resetAdminRoomPassword").onclick=async()=>{const c=$("adminRoomSelect").value,pw=$("adminResetRoomPassword").value;if(!isAdmin||!c)return;try{await update(ref(db,"rooms/"+c+"/info"),{passwordHash:pw?await digest(pw):""});$("adminResetRoomPassword").value="";status("방 비밀번호를 재설정했습니다.")}catch(e){status("재설정 실패: "+e.message)}};
$("deleteAdminRoom").onclick=async()=>{const c=$("adminRoomSelect").value;if(!isAdmin||!c||!confirm("이 방의 메시지와 방 정보를 삭제할까요?"))return;try{await remove(ref(db,"rooms/"+c));await refreshAdminRooms();$("adminMessages").replaceChildren();status("방을 삭제했습니다.")}catch(e){status("방 삭제 실패: "+e.message)}};
async function loadAdminMessages(older=false){if(!isAdmin)return;const c=$("adminRoomSelect").value;if(!c){status("관리할 방을 선택하세요.");return}adminRoom=c;try{let q;if(older&&adminOldestKey)q=query(ref(db,"rooms/"+c+"/messages"),orderByKey(),endAt(adminOldestKey),limitToFirst(101));else q=query(ref(db,"rooms/"+c+"/messages"),orderByKey(),limitToLast(100));const snap=await get(q),arr=[];snap.forEach(ch=>arr.push({key:ch.key,val:ch.val()}));if(older&&arr.length&&arr[arr.length-1].key===adminOldestKey)arr.pop();if(arr.length)adminOldestKey=arr[0].key;const box=$("adminMessages");if(!older)box.replaceChildren();arr.reverse().forEach(({key,val})=>{const item=document.createElement("div");item.className="admin-item";const label=document.createElement("span");label.textContent=String(val.nickname||"익명")+" · "+String(val.text||val.attachmentName||"").slice(0,100);const b=document.createElement("button");b.textContent="삭제";b.onclick=async()=>{if(confirm("메시지를 삭제할까요?")){await remove(ref(db,"rooms/"+c+"/messages/"+key));if(val.attachmentId)await remove(ref(db,"attachments/"+val.attachmentId));item.remove()}};item.append(label,b);box.append(item)});$("olderAdminMessages").disabled=arr.length<100}catch(e){status("메시지 조회 실패: "+e.message)}}
$("loadAdminMessages").onclick=()=>{adminOldestKey=null;loadAdminMessages(false)};$("olderAdminMessages").onclick=()=>loadAdminMessages(true);
$("loadAdminUsers").onclick=async()=>{if(!isAdmin)return;const c=$("adminRoomSelect").value;if(!c)return;try{const [ms,mem]=await Promise.all([get(ref(db,"rooms/"+c+"/messages")),get(ref(db,"rooms/"+c+"/members"))]),users=new Map();ms.forEach(ch=>{const d=ch.val();if(d?.uid)users.set(d.uid,d.nickname||"익명")});const box=$("adminUsers");box.replaceChildren();if(mem.exists())Object.keys(mem.val()||{}).forEach(uid=>{if(!users.has(uid))users.set(uid,"참여자")});users.forEach((nick,uid)=>{const item=document.createElement("div");item.className="admin-item";const label=document.createElement("span");label.textContent=nick+" · UID: "+uid;const blockedBtn=document.createElement("button");blockedBtn.textContent="차단/해제";blockedBtn.onclick=async()=>{const r=ref(db,"rooms/"+c+"/blocked/"+uid),v=await get(r);await set(r,v.val()!==true);status(v.val()===true?"차단을 해제했습니다.":"사용자를 차단했습니다.")};item.append(label,blockedBtn);box.append(item)})}catch(e){status("참여자 조회 실패: "+e.message)}};
$("changeAdminPassword").onclick=async()=>{if(!isAdmin)return;const pw=prompt("새 관리자 비밀번호(최소 6자)");if(!pw)return;if(pw.length<6){status("비밀번호는 6자 이상이어야 합니다.");return}try{await updatePassword(auth.currentUser,pw);status("관리자 비밀번호를 변경했습니다.")}catch(e){status("변경 실패: 다시 로그인한 뒤 시도하세요. "+e.message)}};
try{await authReady();clearTimeout(window.linkFirebaseWatchdog);status("Firebase 연결 완료. 방 이름과 비밀번호로 만들거나 입장하세요.");await adminCheck()}
catch(e){clearTimeout(window.linkFirebaseWatchdog);status("Firebase 로그인 실패: "+e.message+" · Authentication에서 익명 로그인을 켰는지 확인하세요.")}
</script></body></html>
